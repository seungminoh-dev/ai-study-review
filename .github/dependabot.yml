# 의존성 갱신 (개선점 15). 주 1회 PR로 온다. npm은 한 PR로 묶고, 워크플로의 액션(SHA 고정)도 같이 올린다.
# PR은 CI가 돌고, 합칠지는 사람이 정한다 (main에 push하면 바로 배포된다).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
