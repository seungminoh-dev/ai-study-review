name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check settings
        id: check
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::GitHub 저장소 secret이 없어서 배포를 건너뜁니다:$missing (docs/runbook.md)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q 'moai.example.com' apps/worker/wrangler.jsonc || grep -q '00000000-0000-0000-0000-000000000000' apps/worker/wrangler.jsonc; then
            echo "::error::apps/worker/wrangler.jsonc에 자리표시자가 남아 있어요. 도메인과 database_id를 채워 주세요 (docs/runbook.md)."
            exit 1
          fi

      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - name: Build PWA
        if: steps.check.outputs.skip != 'true'
        run: npm run build
      - if: steps.check.outputs.skip != 'true'
        run: npm test
      # 마이그레이션 직전 시점을 남긴다. 잘못되면 이 bookmark로 Time Travel 복원한다 (docs/runbook.md 되돌리기)
      - name: Note D1 bookmark
        if: steps.check.outputs.skip != 'true'
        working-directory: apps/worker
        continue-on-error: true
        run: npx wrangler d1 time-travel info moai
      - name: Apply D1 migrations
        if: steps.check.outputs.skip != 'true'
        working-directory: apps/worker
        run: npx wrangler d1 migrations apply moai --remote
      - name: Deploy Worker
        if: steps.check.outputs.skip != 'true'
        working-directory: apps/worker
        run: npx wrangler deploy
      # 배포한 것이 실제로 나가는지 본다: 화면 JS가 이번 빌드와 같고, 인증이 필요한 곳은 막혀 있다
      - name: Check production
        if: steps.check.outputs.skip != 'true'
        run: |
          origin=$(grep -o '"APP_ORIGIN": *"[^"]*"' apps/worker/wrangler.jsonc | sed 's/.*"\(https[^"]*\)"/\1/')
          local_js=$(ls apps/web/dist/assets | grep -E '^index-.*\.js$')
          for i in $(seq 1 10); do
            prod_js=$(curl -fsS "$origin/" | grep -o '/assets/index-[^"]*\.js' | head -1 | sed 's#/assets/##')
            [ "$prod_js" = "$local_js" ] && break
            sleep 6
          done
          [ "$prod_js" = "$local_js" ] || { echo "::error::운영 화면 JS($prod_js)가 이번 빌드($local_js)와 달라요."; exit 1; }
          expect() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "${@:3}" "$origin$2")
            [ "$code" = "$1" ] || { echo "::error::$2 응답이 $code예요 (기대 $1)."; exit 1; }
          }
          expect 200 "/assets/$local_js"
          expect 200 /.well-known/oauth-authorization-server
          expect 401 /api/me
          expect 401 /mcp -X POST -H 'content-type: application/json' -d '{}'
          echo "운영 확인: $origin, $local_js"
