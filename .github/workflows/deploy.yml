name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check settings
        id: check
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::GitHub 저장소 secret이 없어서 배포를 건너뜁니다:$missing (docs/mvp0-runbook.md 4단계)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q 'moai.example.com' apps/worker/wrangler.jsonc || grep -q '00000000-0000-0000-0000-000000000000' apps/worker/wrangler.jsonc; then
            echo "::error::apps/worker/wrangler.jsonc에 자리표시자가 남아 있어요. 도메인과 database_id를 채워 주세요 (docs/mvp0-runbook.md 1단계)."
            exit 1
          fi

      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npm test
      - name: Apply D1 migrations
        if: steps.check.outputs.skip != 'true'
        working-directory: apps/worker
        run: npx wrangler d1 migrations apply moai --remote
      - name: Deploy Worker
        if: steps.check.outputs.skip != 'true'
        working-directory: apps/worker
        run: npx wrangler deploy
