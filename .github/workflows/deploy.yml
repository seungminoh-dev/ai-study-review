name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # 손으로 돌릴 때(workflow_dispatch) 다른 브랜치를 고르면 리뷰 없이 운영 D1에 마이그레이션이 들어간다. main만 배포한다
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Check settings
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::GitHub 저장소 secret이 없어서 배포를 건너뜁니다:$missing (docs/runbook.md)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q 'moai.example.com' apps/worker/wrangler.jsonc || grep -q '00000000-0000-0000-0000-000000000000' apps/worker/wrangler.jsonc; then
            echo "::error::apps/worker/wrangler.jsonc에 자리표시자가 남아 있어요. 도메인과 database_id를 채워 주세요 (docs/runbook.md)."
            exit 1
          fi

      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      # CI를 기다리지 않고 바로 배포하므로, 테스트가 지나지 않는 경로의 타입 오류도 여기서 막는다
      - name: Typecheck
        if: steps.check.outputs.skip != 'true'
        run: npm run typecheck
      - name: Build PWA
        if: steps.check.outputs.skip != 'true'
        run: npm run build
      - if: steps.check.outputs.skip != 'true'
        run: npm test
      # 마이그레이션 직전 시점을 남긴다. 잘못되면 이 bookmark로 Time Travel 복원한다 (docs/runbook.md 되돌리기)
      # Cloudflare 토큰은 이 아래 세 단계에만 준다 (빌드·테스트 단계의 의존성 코드는 읽지 못한다)
      - name: Note D1 bookmark
        if: steps.check.outputs.skip != 'true'
        working-directory: apps/worker
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 time-travel info moai
      - name: Apply D1 migrations
        if: steps.check.outputs.skip != 'true'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply moai --remote
      - name: Deploy Worker
        if: steps.check.outputs.skip != 'true'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      # 배포한 것이 실제로 나가는지 본다: 화면 JS가 이번 빌드와 같고, 인증이 필요한 곳은 막혀 있다
      - name: Check production
        if: steps.check.outputs.skip != 'true'
        run: |
          origin=$(grep -o '"APP_ORIGIN": *"[^"]*"' apps/worker/wrangler.jsonc | sed 's/.*"\(https[^"]*\)"/\1/')
          local_js=$(ls apps/web/dist/assets | grep -E '^index-.*\.js$')
          for i in $(seq 1 10); do
            prod_js=$(curl -fsS "$origin/" | grep -o '/assets/index-[^"]*\.js' | head -1 | sed 's#/assets/##')
            [ "$prod_js" = "$local_js" ] && break
            sleep 6
          done
          [ "$prod_js" = "$local_js" ] || { echo "::error::운영 화면 JS($prod_js)가 이번 빌드($local_js)와 달라요."; exit 1; }
          expect() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "${@:3}" "$origin$2")
            [ "$code" = "$1" ] || { echo "::error::$2 응답이 $code예요 (기대 $1)."; exit 1; }
          }
          expect 200 "/assets/$local_js"
          expect 200 /.well-known/oauth-authorization-server
          expect 200 /api/health
          expect 401 /api/me
          expect 401 /api/admin/usage
          expect 401 /mcp -X POST -H 'content-type: application/json' -d '{}'
          echo "운영 확인: $origin, $local_js"
