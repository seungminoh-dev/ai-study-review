name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Worker 테스트가 wrangler.jsonc의 정적 파일 폴더(apps/web/dist)를 읽으므로 먼저 만든다
      - run: npm run build
      - run: npm test
